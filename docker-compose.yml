# Production-развёртывание на одном сервере: приложение + PostgreSQL + Caddy (HTTPS).
# Перед запуском заполните .env (см. .env.example) и задайте APP_DOMAIN и POSTGRES_PASSWORD.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: yappibot
      POSTGRES_USER: yappibot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U yappibot']
      interval: 10s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://yappibot:${POSTGRES_PASSWORD}@db:5432/yappibot

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports: ['80:80', '443:443']
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?задайте APP_DOMAIN в .env, например app.yourdomain.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  pgdata:
  caddy_data:
